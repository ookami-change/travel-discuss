# Production: `docker compose up -d --build`. Reads secrets from .env (see .env.example).
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: travel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: travel_discuss
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel -d travel_discuss"]
      interval: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://travel:${POSTGRES_PASSWORD}@db:5432/travel_discuss
      COOKIE_SECURE: "true"
    # Bind to localhost only; put Caddy/Nginx in front for HTTPS.
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"

volumes:
  pgdata:
